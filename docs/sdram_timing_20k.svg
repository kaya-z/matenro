<rect x="756.0" y="290" width="6.0" height="28" fill="#ec7063" stroke="#333" stroke-width=".5"/>
<text class="small" x="759.0" y="328" text-anchor="middle">W</text>
<rect x="906.0" y="290" width="6.0" height="28" fill="#f5b041" stroke="#333" stroke-width=".5"/>
<text class="small" x="909.0" y="328" text-anchor="middle">A</text>
<rect x="924.0" y="290" width="6.0" height="28" fill="#ec7063" stroke="#333" stroke-width=".5"/>
<text class="small" x="927.0" y="328" text-anchor="middle">W</text>
<text class="small" x="450.0" y="160" text-anchor="start" style="fill:#c0392b">24 clk held: request, ACT, READ (CL 2), data (a refresh came in between)</text>
<text class="small" x="612.0" y="280" text-anchor="start" style="fill:#555">writes are posted: the CPU is not held,</text>
<text class="small" x="612.0" y="294" style="fill:#555">the controller writes in the background (10 clk each)</text>
<text class="small" x="8" y="358">SDRAM command: A = ACTIVE (open the row), R = READ with auto precharge (data 3 clocks later), W = WRITE with auto precharge, F = AUTO REFRESH.  An access takes 9-10 clocks, one at a time.</text>
<text class="small" x="8" y="372">Bus cycle: the number is its length; 28 clocks is the E cycle with no wait; a cache miss makes it 41.  A hit (the last $0300 fetch) and a posted write take no extra time.</text>
<text class="small" x="8" y="386">Measured on the RTL of fpga/tn20k (Verilator, tb.cpp VCD), not on the board.  Signals: soc.e, cpu_a, stall, cc_hit, ps_rd/ps_wr, ctl_busy, sd_ras_n/cas_n/we_n.</text>
</svg>